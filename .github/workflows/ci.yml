name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ['1.25']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install uv
        run: pip install uv

      # internal/v3 is owned by v3-ci.yml, which builds it with the required
      # `-tags "cgo sqlite_fts5"` (its store needs the SQLite FTS5 module and
      # cgo). This generic job runs untagged, so it must exclude internal/v3 —
      # otherwise its tests fail at migration time with "no such module: fts5".
      - name: Run tests (Linux/macOS)
        if: runner.os != 'Windows'
        run: go test -race -coverprofile=coverage.out $(go list ./... | grep -v '/internal/v3')

      # Windows: the runner has no sqlite3.h, so cgo must be OFF here. With cgo
      # on (the default, since the runner has gcc and -race forces it), building
      # cmd/foldermcp — which imports internal/v3 — compiles v3's cgo sqlite-vec
      # path and fails on the missing header. CGO_ENABLED=0 selects v3's nocgo
      # stubs; it also precludes -race (which requires cgo). v3's cgo coverage
      # lives in v3-ci.yml (linux-cgo); its nocgo-windows job covers v3 on Windows.
      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        env:
          CGO_ENABLED: '0'
        run: |
          $pkgs = go list ./... | Where-Object { $_ -notmatch 'internal/v3' }
          go test $pkgs

      - name: Build binary
        if: runner.os != 'Windows'
        run: go build -o foldermcp ./cmd/foldermcp

      - name: Build binary (Windows)
        if: runner.os == 'Windows'
        env:
          CGO_ENABLED: '0' # no sqlite3.h on the runner; build the nocgo binary (see test step)
        run: go build -o foldermcp.exe ./cmd/foldermcp

      - name: Verify binary
        if: runner.os != 'Windows'
        run: ./foldermcp --help

      - name: Verify binary (Windows)
        if: runner.os == 'Windows'
        run: .\foldermcp.exe --help

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install uv
        run: pip install uv
      - name: Run integration tests
        run: go test -tags integration -v -timeout 120s .

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Install golangci-lint
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh | sh -s -- -b $(go env GOPATH)/bin
      - name: Run golangci-lint
        run: golangci-lint run ./...
