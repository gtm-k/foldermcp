name: v3 CI

on:
  push:
    branches: [main, feat/v3-*]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  v3-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest
      - name: Lint v3 subtree with cgo build tag
        run: golangci-lint run --build-tags cgo ./internal/v3/...

  v3-test-linux-cgo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - name: Install sqlite headers
        run: sudo apt-get install -y libsqlite3-dev
      - name: Run v3 tests with race detection
        run: go test -race -tags cgo ./internal/v3/...
        env:
          CGO_ENABLED: 1

  v3-test-laptop-nocgo:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - name: Run v3 tests without cgo
        run: go test ./internal/v3/...
        env:
          CGO_ENABLED: 0
