# M2 Phase 9 PILOT corpus manifest — OFFLINE.
#
# Assembles a tiny pilot corpus by COPYING git-tracked in-repo testdata fixtures
# (no network). This validates the benchmark machinery end-to-end. It is NOT the
# frozen >=1000-file corpus — that is Phase 9b, authored against the FROZEN
# variant of this schema (url + sha256 + license). See corpus-manifest.schema.md.
#
# Schema (pilot variant): each entry has id, stratum, license, src, dest.
#   src  = repo-relative path of an existing tracked fixture (copied verbatim)
#   dest = corpus-relative destination (forward slashes, unique tail substrings)
#
# Coverage: 26 files = 16 code + 5 md + 3 pdf + 2 data.
# This is the OFFLINE-tracked maximum; the ~30-50 target and the >=1000 frozen
# corpus require the network download path (Phase 9b). See build-corpus.sh.

version: 1
mode: pilot
corpus_id: bench-v1-pilot

entries:

  # ── code: micro Go fixtures (tree-sitter -> code_ast) ──
  - id: code-go-config
    stratum: code
    license: repo-internal-fixture
    src: testdata/v3/micro/code-go/config.go
    dest: code-go/config.go
