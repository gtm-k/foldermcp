# M1 seed labeled query set — version 1
# 35 queries spanning 4 personas: tech-enthusiast, researcher, writer, devops.
#
# Relevance scale:
#   0 = not relevant
#   1 = somewhat relevant (mentions the topic but isn't the primary source)
#   2 = highly relevant (directly answers the query)
#
# Each query has at least 2 relevance judgments (multi-grade).
# Author field: "synthetic" for M1 seed queries (single author OK per plan).
#   After M1, authors and judges must be different people.
#
# Judgment paths are relative to the QA workspace root and match MANIFEST.yaml
# dest values. symbol is the function/class/struct being judged.
#
# Freeze policy: this file is frozen at end of week 8 for M1. Further edits
# go into labeled_queries_v2.yaml (M2 expansion to 100–150 queries).

version: 1

