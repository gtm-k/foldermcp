# Micro-fixture labeled query set — G5 smoke variant.
#
# Purpose: validate that the retrieval harness, RRF fusion, and search modes
# work end-to-end against the small 12-file micro-fixture. NOT a substitute
# for the frozen `labeled_queries.yaml` which targets the full QA workspace.
#
# Design: queries bias AGAINST filename-only matching. The query text avoids
# substring-matching the target filename so filename-only returns low recall
# while auto mode can find the target via FTS and/or vector search.
#
# Relevance scale:
#   0 = not relevant
#   1 = somewhat relevant
#   2 = highly relevant (directly answers the query)
#
# Judgment paths are substrings matched against hit paths (not absolute).

